[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-audit-jev"
version = "0.1.0"
description = "Shadow-mode OAuth authentication and authorization audit via TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
